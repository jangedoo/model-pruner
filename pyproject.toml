[project]
name = "model-pruner"
version = "0.1.0"
description = ""
authors = [{ name = "Sanjaya Subedi", email = "jangedoo@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch (>=2.12.1,<3.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "lets-plot (>=4.10.1,<5.0.0)",
    "datasets (>=5.0.0,<6.0.0)",
    "click (>=8.4.2,<9.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "model_pruner", from = "src" }]


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
black = "^26.5.1"
flake8 = "^7.3.0"
rope = "^1.14.0"
ruff = "^0.15.20"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
model-pruner = "model_pruner.cli:cli"
